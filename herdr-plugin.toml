id = "transcripts"
name = "transcripts"
version = "1.0.0"
min_herdr_version = "0.7.0"
description = "Simple fzf finder for session transcripts of coding agents like Claude Code and Codex."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "-c", "exec \"$PWD/transcripts\" warm"]

[[startup]]
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/transcripts\" warm"]

[[panes]]
id = "picker"
title = "transcripts"
placement = "popup"
width = "90%"
height = "85%"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/transcripts\""]
